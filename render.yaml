services:
  - type: web
    name: finance-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile && pnpm build && pnpm prisma:migrate:deploy
    startCommand: pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Cadena de conexión de Supabase (Session pooler, puerto 5432).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # URL pública del frontend en Netlify, sin barra final.
      - key: FRONTEND_URL
        sync: false
      # Envío de avisos por email (WI-2/WI-4). Opcionales en el código:
      # el endpoint interno y el sender fallan cerrados si no están definidos.
      - key: EMAIL_SERVICE_URL
        sync: false
      - key: EMAIL_SERVICE_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
