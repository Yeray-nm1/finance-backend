name: Avisos por email

# El job corre fuera del request del usuario: genera los avisos in-app y envía
# por correo solo las reglas con emailEnabled. CRON_SECRET debe coincidir con
# la variable del mismo nombre configurada en Render.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  process-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar el micro de email
        # Render duerme los servicios del plan free. Reintentar /health evita
        # que el barrido falle mientras el micro sigue arrancando.
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors --max-time 20 \
            https://email-service-ytjp.onrender.com/health

      - name: Procesar avisos y enviar correos
        env:
          BACKEND_URL: https://finance-backend-hb7n.onrender.com
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "x-cron-secret: ${CRON_SECRET}" \
            "${BACKEND_URL}/api/v1/internal/notifications/process"
